# Fuentes oficiales (consultadas el 2026-11-24):
#   INEGI  - Calendario de difusión 2026 y primer semestre 2027
#            https://www.inegi.org.mx/contenidos/saladeprensa/doc/cal_2026.pdf
#            https://www.inegi.org.mx/contenidos/saladeprensa/doc/cal_2027.pdf
#   Banxico - Calendario 2026 de anuncios de política monetaria y minutas;
#            calendario 2026 de la Encuesta de Expectativas.
#   Fed    - Calendario FOMC 2026 y calendario revisado 2027 (12-nov-2026).
#
# Mantenimiento: agregar el calendario de Banxico 2027 cuando se publique
# (el pipeline avisa en el log cuando la cobertura queda a menos de 30 días).
#
# key: enlaza el evento con el dato "previo" que muestra la agenda.
#   inpc_m (inflación mensual) | inpc_q (1a quincena) | igae | ioae | imai | pib_o
#   enoe | banxico | minutas | encuesta | informe | fomc
# hora: hora del centro de México.

coverage_until: 2027-06-30

