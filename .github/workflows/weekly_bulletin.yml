name: Weekly Mexico Macro Bulletin

on:
  schedule:
    # Every Monday 07:00 Monterrey / Mexico City (UTC-6, no DST since 2022) -> 13:00 UTC
    - cron: "0 13 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["src/**", "config/**", "tests/**", "requirements.txt", ".github/workflows/weekly_bulletin.yml"]

permissions:
  contents: write

concurrency:
  group: weekly-bulletin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-bulletin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build bulletin and LinkedIn issue (magazine v5)
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
        run: python src/macro_monitor.py

      - name: Upload carousel (PDF + slide PNGs)
        uses: actions/upload-artifact@v4
        with:
          name: mx-macro-monitor-${{ github.run_number }}
          path: |
            bulletins/
            data/
          retention-days: 90

      - name: Commit weekly outputs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bulletins/*.pdf bulletins/*.png bulletins/*.md bulletins/archive data/
          git diff --staged --quiet || git commit -m "chore: weekly macro bulletin ($(TZ=America/Mexico_City date +'%Y-%m-%d'))"
          git push
