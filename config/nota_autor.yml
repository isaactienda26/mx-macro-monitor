# Nota del autor (párrafo «Mi lectura» del post y del comentario en inglés).
# Escríbela cada semana antes de publicar. Si `semana` no coincide con la semana ISO
# de la corrida, el post se genera sin nota y el checklist lo marca.
# Obligatorio cada semana: los cuatro campos es, cita_es, en y cita_en. El Monitor se publica
# en inglés primero, así que nunca dejes en ni cita_en vacíos ni copiados del español.
# estado: borrador | final   (borrador = propuesta por revisar)
# Estilo: el del Comentario Económico Semanal. Oraciones de unas 21 palabras, verbos literales,
# sin dos puntos, punto y coma ni guiones, sin jerga de mercado.
semana: 2026-W48
estado: final
cita_es: >
  Con el tipo de cambio en estos niveles, Banxico tendrá menos margen para recortar su tasa.
cita_en: >
  With the exchange rate at these levels, Banxico will have less room to cut its rate.
es: >
  La depreciación del peso llega con una tasa de interés real de 2.2%, en la parte baja del
  rango neutral que estima Banxico. Si el tipo de cambio se mantiene en estos niveles, Banxico
  tendrá menos margen para recortar su tasa de interés. Sin embargo, los estudios para México
  muestran que una depreciación tiene un efecto limitado en los precios.
en: >
  The peso's depreciation comes with the real interest rate at 2.2%, in the lower part of the
  neutral range estimated by Banxico. If the exchange rate holds at these levels, Banxico will
  have less room to cut its policy rate. However, studies for Mexico show that a weaker peso has
  a limited effect on prices.
