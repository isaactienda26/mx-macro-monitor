name: Fetch raw data (temporary)
on:
  workflow_dispatch:
  push:
    branches: [feat/linkedin-carousel-v2]
    paths: [src/sources.py, src/config.py, .github/workflows/discover.yml]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests pandas
      - env:
          BANXICO_TOKEN: "${{ secrets.BANXICO_TOKEN }}"
          INEGI_TOKEN: "${{ secrets.INEGI_TOKEN }}"
        run: cd src && python -c "import logging;logging.basicConfig(level=logging.INFO);import sources;d,w=sources.fetch_all();print(w);[print(k,len(v),v.index[-1].date(),v.iloc[-1]) for k,v in d.items()]"
      - uses: actions/upload-artifact@v4
        with: {name: raw, path: data/raw}
