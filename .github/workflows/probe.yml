name: Probe peer data (temporary)
on:
  push:
    branches: [feat/linkedin-carousel-v2]
    paths: [tools/probe_bis.py, .github/workflows/probe.yml]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests && python tools/probe_bis.py
